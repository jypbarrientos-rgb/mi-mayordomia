<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Mayordomía</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f7fa;
}

.header{
    background:#0f766e;
    color:white;
    padding:40px 20px;
    text-align:center;
}

.header h1{
    font-size:42px;
    margin-bottom:10px;
}

.header p{
    font-size:18px;
}

.card{
    background:white;
    max-width:700px;
    margin:40px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h2{
    margin-bottom:15px;
}

.card p{
    margin-bottom:20px;
    line-height:1.6;
}
