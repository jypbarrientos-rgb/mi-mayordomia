<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Mayordomía</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:0;
}

.header{
    background:#0f766e;
    color:white;
    text-align:center;
    padding:40px;
}

.card{
    background:white;
    max-width:700px;
    margin:40px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#15803d;
}

.verse{
    margin-top:20px;
    color:#555;
    font-style:italic;
}
</style>

</head>
<body>

<div class="header">
    <h1>Mi Mayordomía</h1>
    <p>Administra tus recursos con sabiduría</p>
</div>

<div class="card">
    <h2>Bienvenido</h2>

    <p>
        Controla ingresos, gastos, ahorro y metas financieras.
    </p>

    <button onclick="saludar()">
        Comenzar
    </button>

    <div class="verse">
        "Porque donde esté vuestro tesoro,
        allí estará también vuestro corazón."
        <br><br>
        Mateo 6:21
    </div>
</div>

<script>
function saludar() {
    alert("¡Bienvenido a Mi Mayordomía!");
}
</script>

</body>
</html>
